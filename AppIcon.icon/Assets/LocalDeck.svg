<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>LocalDeck</title>
  <desc>A mint terminal and split workspace on a dark rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#253E42" />
      <stop offset="1" stop-color="#101E23" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#AEF6D9" />
      <stop offset="1" stop-color="#4AD6B7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#071719" flood-opacity="0.3" />
    </filter>
  </defs>
  <g id="workspace" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M302 252H750a48 48 0 0 1 48 48" stroke="#69CBB7" stroke-opacity="0.48" stroke-width="26" />
    <rect x="218" y="304" width="588" height="448" rx="52" stroke="url(#mint)" stroke-width="30" />
    <path d="M222 408H802" stroke="#7BE6C6" stroke-opacity="0.65" stroke-width="22" />
    <path d="M598 416V740" stroke="#7BE6C6" stroke-opacity="0.65" stroke-width="22" />
    <path d="M308 490L386 556L308 622" stroke="url(#mint)" stroke-width="38" />
    <path d="M432 626H500" stroke="#9DF1D2" stroke-width="34" />
    <rect x="650" y="472" width="102" height="82" rx="17" fill="#81E8C9" />
    <rect x="650" y="586" width="102" height="104" rx="17" fill="#4AD6B7" fill-opacity="0.48" />
  </g>
</svg>