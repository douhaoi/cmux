# Python regression execution registry.
#
# Automatic lanes describe where a test executes. `legacy` is migration
# inventory only: existing files may remain legacy while we model their
# current execution path, but newly added tests may not enter as legacy.
# `manual` entries require a reason.
#
# Lane runners may run a lane's tests concurrently, so a test keeps its files
# and sockets in its own temporary directory or pid-scoped names. `serial = true` runs an entry alone, for tests that assert
# wall-clock bounds a busy machine could miss.
